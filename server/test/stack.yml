# A throwaway copy of the app for end-to-end tests. Build the app image first:
#   docker build -t chrome-home-app -f server/Dockerfile .
#   docker compose -f server/test/stack.yml run --rm --build runner
name: chrome-home-test

x-app: &app
  image: chrome-home-app
  depends_on:
    seed:
      condition: service_completed_successfully
    fake-github:
      condition: service_started

x-app-environment: &app-environment
  DB_HOST: db
  DB_NAME: test
  DB_USER: test
  DB_PASSWORD: throwaway
  PUBLIC_URL: http://app:3000
  OWNER_GITHUB_LOGIN: Owner-User
  GITHUB_CLIENT_ID: test-client
  GITHUB_CLIENT_SECRET: test-secret
  GITHUB_WEB_URL: http://fake-github:4000
  GITHUB_API_URL: http://fake-github:4000
  MAX_USERS: "5"
  EXTENSION_IDS: ckmmmpglhbeeeppgclggngmgdjogmlmh
  ADMIN_GITHUB_ID: "1001"
  HN_API_URL: http://fake-github:4000
  GITHUB_APP_SLUG: home-base-test
  GITHUB_APP_CLIENT_ID: test-app-client
  GITHUB_APP_CLIENT_SECRET: test-app-secret
  TOKEN_ENCRYPTION_KEY: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
  GITHUB_REFRESH_FLOOR_SECONDS: "0"
  MONITOR_SCHEDULER: "off"

x-tests: &tests
  build: .
  environment:
    DB_HOST: db
    DB_NAME: test
    DB_USER: test
    DB_PASSWORD: throwaway

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: throwaway-root
      MYSQL_DATABASE: test
      MYSQL_USER: test
      MYSQL_PASSWORD: throwaway
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pthrowaway-root --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Creates a database in the oldest format, so the tests also cover upgrading real data.
  seed:
    <<: *tests
    command: ["node", "seed.js"]
    depends_on:
      db:
        condition: service_healthy

  fake-github:
    <<: *tests
    command: ["node", "fake-github.js"]

  app:
    <<: *app
    environment:
      <<: *app-environment

  # These share the database, and differ only in the settings being tested.
  app-allowlist:
    <<: *app
    environment:
      <<: *app-environment
      ALLOWED_GITHUB_LOGINS: "alice, Owner-Renamed"

  app-admin-email:
    <<: *app
    environment:
      <<: *app-environment
      ADMIN_EMAIL: alice@example.COM

  app-store-link:
    <<: *app
    environment:
      <<: *app-environment
      EXTENSION_URL: https://chromewebstore.google.com/detail/test

  # Monitors refuse private addresses, and every test service is on one. This setting exists only
  # so the tests can reach a stand-in site. The production compose file never sets it.
  app-monitors:
    <<: *app
    environment:
      <<: *app-environment
      MONITOR_ALLOW_PRIVATE: "true"
      MONITOR_SCHEDULER: "on"
      MONITOR_INTERVAL_SECONDS: "1"

  app-rate-limit:
    <<: *app
    environment:
      <<: *app-environment
      RATE_LIMIT_PER_MINUTE: "5"

  runner:
    <<: *tests
    command: ["node", "flow.test.js"]
    depends_on:
      - app
      - app-monitors
      - app-rate-limit
      - app-allowlist
      - app-admin-email
      - app-store-link
