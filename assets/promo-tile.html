<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home Base promo tile</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 14px;
      color: #ffffff;
      font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #312e81, #0f766e);
    }
    img { width: 92px; height: 92px; filter: drop-shadow(0 8px 18px rgb(0 0 0 / 0.3)); }
    h1 { margin: 0; font-size: 36px; letter-spacing: -0.02em; }
    p { margin: 0; font-size: 17px; opacity: 0.92; }
  </style>
</head>
<body>
  <img src="logo.svg" alt="">
  <h1>Home Base</h1>
  <p>Your own new tab page</p>
</body>
</html>
