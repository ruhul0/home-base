name: chrome-home

services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      PUBLIC_URL: https://chrome.ruhul0.com
      OWNER_GITHUB_LOGIN: ruhul0
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ALLOWED_GITHUB_LOGINS: ${ALLOWED_GITHUB_LOGINS:-}
      MAX_USERS: ${MAX_USERS:-200}
      EXTENSION_IDS: ${EXTENSION_IDS:-ckmmmpglhbeeeppgclggngmgdjogmlmh}
      EXTENSION_URL: ${EXTENSION_URL:-}
      ADMIN_GITHUB_ID: ${ADMIN_GITHUB_ID:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:13100:3000"
    networks:
      - web
      - database
    mem_limit: 256m

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m

  # Encrypted daily backups to Cloudflare R2. It stays idle until deploy/set-r2-backup.sh configures it.
  backup:
    build: deploy/backup
    restart: unless-stopped
    user: "${BACKUP_UID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_ENV_FILE: /run/home-base/.env
    # The folder is mounted rather than the file, because setup scripts replace .env when saving.
    volumes:
      - ./:/run/home-base:ro
    networks:
      - web
      - database
    mem_limit: 256m

networks:
  web:
  database:
    internal: true

volumes:
  mysql-data:
